name: police_marked
description: Generated by `makecar police` (tier marked, seed 52). marked police sedan
  in black; siren, laptop mount, steel wheels, spotlight, government plates, push
  bar, light bar, lettering, two tone, stripe, unit number, partition
seed: 52
body:
  hints: {door_count: 4}
  random: {amount: 0.12}
  livery: {doors: secondary, roof: secondary}
palette: {paint: '#111214', paint_secondary: '#f4f4f0', interior: '#1e1f22', seat: '#26272b',
  interior_accent: '#3a3c40', wood: '#2b2c30'}
components:
  assign:
    plate:
      options: {style: government}
    roof_mount:
      component: light.bar
      options: {colors: red_blue, low_profile: false}
    bumper_front:
      component: bumper.push_bar
      options: {siren: false}
    intake:
      options: {siren: true}
    console:
      options: {laptop_mount: true}
    wheel:
      component: wheel.steel
      options: {hubcap: false, rim_color: '#141516'}
    spotlight_L: light.spotlight
    cabin_partition:
      component: partition.cage
      options: {style: clear}
    panel_door_front:
      component: decal.panel
      options: {text: POLICE, text_height: 0.14, text_color: '#14213d', stripe: true,
        stripe_color: '#14213d', stripe_accent: '#c0c4cc'}
    panel_door_rear:
      component: decal.panel
      options: {text: null, text_height: 0.06, text_y: 0.3, text_color: '#14213d',
        stripe: true, stripe_color: '#14213d', stripe_accent: '#c0c4cc'}
    panel_deck:
      component: decal.panel
      options: {text: POLICE, text_height: 0.1, text_color: '#f4f4f0'}
    panel_quarter:
      component: decal.panel
      options: {text: '400', text_height: 0.09, text_y: 0.3, text_color: '#14213d',
        stripe: true, stripe_color: '#14213d', stripe_accent: '#c0c4cc'}
    panel_roof:
      component: decal.panel
      options: {text: '400', text_height: 0.32, text_x: 0.35, text_color: '#14213d'}
    panel_fender:
      component: decal.panel
      options: {stripe: true, stripe_color: '#14213d', stripe_accent: '#c0c4cc'}
police:
  tier: marked
  agency: POLICE
  unit: '400'
  paint: black
  features: {concealed_lights: false, siren: true, patrol_model: true, fleet_paint: true,
    dark_rear_glass: false, laptop_mount: true, steel_wheels: true, spotlight: true,
    extra_antennas: false, government_plates: true, push_bar: true, light_bar: true,
    lettering: true, two_tone: true, stripe: true, unit_number: true, partition: true,
    raised_stance: false}

name: police_unmarked
description: Generated by `makecar police` (tier unmarked, seed 2). unmarked state
  trooper suv in black; concealed lights, siren, laptop mount, steel wheels, spotlight,
  push bar, concealed light spots
seed: 2
body:
  style: suv
  hints: {door_count: 4}
  random: {amount: 0.12}
palette: {paint: '#111214', paint_secondary: '#f4f4f0', interior: '#1e1f22', seat: '#26272b',
  interior_accent: '#3a3c40', wood: '#2b2c30'}
components:
  assign:
    plate:
      options: {region: us}
    bumper_front:
      component: bumper.push_bar
      options: {siren: true}
    intake:
      options: {siren: true}
    headliner:
      options: {visor_lights: true}
    console:
      options: {laptop_mount: true}
    wheel:
      component: wheel.steel
      options: {hubcap: false, rim_color: '#141516'}
    spotlight_L: light.spotlight
    spotlight_R: light.spotlight
police:
  tier: unmarked
  agency: STATE TROOPER
  unit: '455'
  paint: black
  features:
    concealed_lights: true
    siren: true
    patrol_model: true
    fleet_paint: true
    dark_rear_glass: false
    laptop_mount: true
    steel_wheels: true
    spotlight: true
    extra_antennas: false
    government_plates: false
    push_bar: true
    light_bar: false
    lettering: false
    two_tone: false
    stripe: false
    unit_number: false
    partition: false
    raised_stance: false
    concealed_light_spots: [visor]
  lettering: {font: sans-condensed-bold, letter_spacing: 0.007, color: '#f4f4f0',
    outline: 0.005, outline_color: '#0b0b0d'}

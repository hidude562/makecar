name: Deploy web editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pyyaml pytest
      - name: Quick tests
        run: python -m pytest -q tests/test_geometry.py tests/test_morph.py tests/test_connectors.py tests/test_export.py tests/test_pipeline.py tests/test_viewer_server.py tests/test_viewer_hooks.py
      - name: Build site
        run: python -m scripts.build_web -o site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "makecar"
version = "0.1.0"
description = "MakeHuman-style procedural car modeller: morphable body, connectors, target-based components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "pyyaml>=5.4"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
makecar = "makecar.cli:main"

[tool.setuptools.packages.find]
include = ["makecar*"]

[tool.setuptools.package-data]
makecar = ["data/fonts/*.json", "data/fonts/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
